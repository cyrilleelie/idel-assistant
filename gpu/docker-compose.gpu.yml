version: '3.9'

services:

  vllm:
    image: vllm/vllm-openai:latest
    container_name: idel-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - /data/models:/models:ro
      - /data/models/lora:/lora:ro
      - /data/vllm-logs:/logs
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      --model /models/mistral-small-3.1-awq
      --quantization awq
      --port 8000
      --host 0.0.0.0
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --max-num-seqs 16
      --enable-lora
      --lora-modules idel-v1=/lora/idel-lora-v1
      --max-lora-rank 16
      --swap-space 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: idel-whisper
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - MODELS_DIR=/models
      - WHISPER_DEVICE=cuda
      - COMPUTE_TYPE=int8
      - NUM_WORKERS=2
    volumes:
      - /data/models:/models:ro
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  kokoro:
    build:
      context: .
      dockerfile: Dockerfile.kokoro
    container_name: idel-kokoro
    volumes:
      - /data/models/kokoro:/kokoro-models:ro
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx-gpu:
    image: nginx:alpine
    container_name: idel-nginx-gpu
    volumes:
      - ./nginx-gpu.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "10.0.0.5:9000:9000"
    depends_on:
      - vllm
      - whisper
      - kokoro
    restart: unless-stopped
