server {
    listen 9000;

    # STT (faster-whisper)
    location /transcribe {
        proxy_pass http://whisper:8001/transcribe;
        proxy_read_timeout 60s;
        client_max_body_size 30M;
    }

    # TTS (Kokoro)
    location /synthesize {
        proxy_pass http://kokoro:8002/synthesize;
        proxy_read_timeout 30s;
    }

    # Health checks
    location /health/whisper  { proxy_pass http://whisper:8001/health; }
    location /health/kokoro   { proxy_pass http://kokoro:8002/health; }

    # vLLM non disponible en mode CPU
    location /v1/ {
        return 503 '{"error": "vLLM not available in CPU mode"}';
        add_header Content-Type application/json;
    }
    location /health/vllm {
        return 503 '{"error": "vLLM not available in CPU mode"}';
        add_header Content-Type application/json;
    }
}
