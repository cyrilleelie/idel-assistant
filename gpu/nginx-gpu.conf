server {
    listen 9000;

    # LLM (vLLM OpenAI-compatible)
    location /v1/ {
        proxy_pass http://vllm:8000/v1/;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # STT (faster-whisper)
    location /transcribe {
        proxy_pass http://whisper:8001/transcribe;
        proxy_read_timeout 60s;
        client_max_body_size 30M;
    }

    # TTS (Kokoro)
    location /synthesize {
        proxy_pass http://kokoro:8002/synthesize;
        proxy_read_timeout 30s;
    }

    # Health checks
    location /health/vllm    { proxy_pass http://vllm:8000/health; }
    location /health/whisper  { proxy_pass http://whisper:8001/health; }
    location /health/kokoro   { proxy_pass http://kokoro:8002/health; }
}
